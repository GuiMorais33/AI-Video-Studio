[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio-engine"
version = "0.1.0"
description = "Motor local do AI Video Studio: preparo de vídeo, rastreamento com SAM 2.1 e exportação."
requires-python = ">=3.10"
# PyTorch e SAM 2.1 não estão listados aqui de propósito: a versão do PyTorch
# depende do hardware (CPU ou CUDA) e o SAM 2 é instalado do repositório oficial
# da Meta. Use scripts/setup.sh, que cuida das duas coisas.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
